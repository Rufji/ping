<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet"
   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
   integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
   crossorigin="anonymous" referrerpolicy="no-referrer" 
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Ping coming soon page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <img src="./images/logo.svg" alt="" class="logo">
  <div class="text">
      <H1>We are launching <span class="black">soon!</span></H1>
      <p>Subscribe and get notified</p>
    </div>
      <div class="input">
          <div class="inputEmail">
            <input type="email" name="" id="emailInput" placeholder="Your email address...">
            <p class="error"></p>
          </div>
          <button class="submitBtn">Notify Me</button>
      </div>
    
    <img src="./images/illustration-dashboard.png" alt="" class="hero">
    <div class="socials">
      <div class="socialCircle"><i class="fa-brands fa-xs fa-facebook-f" ></i></div>
      <div class="socialCircle"><i class="fa-brands fa-xs fa-twitter" ></i></div>
      <div class="socialCircle"><i class="fa-brands fa-xs fa-instagram"></i></div>
    </div>
    <div class="copyright">&copy; Copyright Ping. All rights reserved.</div>
    <div class="container">
  </div>

  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Mahmud++;</a>.
    </p>
  </footer>
  <script src="index.js"></script>
</body>
</html>
